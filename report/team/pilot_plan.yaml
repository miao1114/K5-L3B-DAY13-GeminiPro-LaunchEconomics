# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu, chênh 5 điểm: 1.251 yêu cầu/nhóm.
#   b) Theo nhân viên, m = 75: DE=2,48; n=3.103 yêu cầu/nhóm; 42 nhân viên/nhóm (84 tổng, vượt 40 hiện có).
#   c) 20 nhân viên/nhóm: n hiệu dụng tối đa=1.000/nhóm.
#   d) 6 depot/nhóm: n hiệu dụng tối đa=300/nhóm.
#   e) Chênh 6 điểm: n=859/nhóm; 20 nhân viên/nhóm cần m≥299 yêu cầu/người; DE=6,96.
#   Tỉ lệ mở lại 7 ngày: 4,25% (51/1.200); trong phạm vi: 3,97%.
#   Power khi tác động thật +5 điểm với n=859/nhóm: 0,642.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia theo nhân viên (20 + 20):
#   1. Có: 20 nhân viên đối chứng chạy cùng tuần, cùng depot.
#   2. Bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Có rủi ro chia sẻ câu trả lời trong depot; hạn chế bằng quyền truy cập theo tài khoản và log lượt dùng theo staff_id.
#   4. Có: chốt chỉ số chính, ngưỡng, luật dừng và ngày quyết định trước ngày bắt đầu.
#   5. Có, 20 cụm nhân viên mỗi nhóm.
#
# Đánh đổi: 20 nhân viên mỗi nhóm không đủ power cho MDE 5 điểm; chấp nhận MDE 6 điểm
# (n=859/nhóm, m≥299 yêu cầu/người, DE=6,96); power còn 0,642 nếu tác động thật là 5 điểm.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại là 4,25% (51/1.200), trong phạm vi là 3,97%;
# dùng ngưỡng so với đối chứng (+2 điểm) và trần tuyệt đối 6% để tránh dừng ngay tuần đầu.

pilot:
  owner: "?"                      # một người có tên vai trò, không ghi "cả đội"
  scope: "?"                      # loại yêu cầu nào, depot nào; dựa vào kết quả A3
  assignment:
    unit: "staff"                 # phân tầng theo depot, ngẫu nhiên theo nhân viên
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96           # 20 nhân viên/nhóm, m≥299 yêu cầu/người
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng chạy cùng tuần, cùng depot"
    spillover_risk: "Có thể chia sẻ câu trả lời trong depot; giới hạn quyền truy cập theo tài khoản và log lượt dùng theo staff_id"
    predeclared: "Chốt chỉ số chính, ngưỡng, luật dừng và ngày quyết định trước ngày bắt đầu pilot"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng ≥ 2 điểm phần trăm hoặc vượt 6%, hoặc có ≥ 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công > 8.000đ TRONG 2 tuần liên tiếp THÌ PM thu hẹp phạm vi về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở rộng sang hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "?"                   # ai bấm, mất bao lâu, khách được phục vụ bằng gì
  decision_date: "?"
  simulated_inputs: ["?"]         # liệt kê mọi con số giả lập đã dùng
